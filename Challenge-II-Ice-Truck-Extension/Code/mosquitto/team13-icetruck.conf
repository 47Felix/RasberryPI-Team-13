# Team13-1 Ice Truck (Challenge II, Track A #193): externer MQTT-Listener.
#
# Debian-Mosquitto bindet ohne eigene Konfiguration nur auf 127.0.0.1/::1 -
# damit erreicht Node-RED (laeuft lokal auf dem Pi) den Broker zwar, aber
# kein Handy/Tablet im Schul-WLAN oder per Tailscale. Dieser Listener macht
# den Broker auf allen Interfaces erreichbar, mit Passwort-Pflicht (kein
# allow_anonymous) und einer ACL, die den einzigen bislang angelegten
# Nutzer (team13-1) auf das eigene Topic-Praefix beschraenkt.
#
# Installiert nach /etc/mosquitto/conf.d/team13-icetruck.conf auf dem Pi.
# Passwortdatei (/etc/mosquitto/passwd) bewusst NICHT hier im Repo - siehe
# "Zugangsdaten"-Regel im Vault, Nutzer/Passwort stehen in den
# Claude-Projekt-Anweisungen.

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
