[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# Komplette Messzeile (status-Topic aus Challenge II, Track B) als JSON
[[inputs.mqtt_consumer]]
  servers = ["ssl://mosquitto:8883"]
  # Zertifikat gilt fuer den oeffentlichen Hostnamen; intern daher Verifikation ueber Hostnamen im Docker-Netz nicht moeglich
  insecure_skip_verify = true
  username = "$MQTT_USER"
  password = "$MQTT_PASSWORD"
  topics = ["team13-1/icetruck/status"]
  data_format = "json_v2"
  name_override = "icetruck"
  client_id = "telegraf-cloud"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "icetruck"
    timestamp_path = "timestamp_utc"
    timestamp_format = "2006-01-02T15:04:05Z07:00"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sensor_board_temp_c"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "actor_board_temp_c"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sensor_board_raw"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "actor_board_raw"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "fan_pwm"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "valve_angle"
      type = "int"
  [inputs.mqtt_consumer.tags]
    truck = "team13-1"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "team13"
  bucket = "icetruck"
