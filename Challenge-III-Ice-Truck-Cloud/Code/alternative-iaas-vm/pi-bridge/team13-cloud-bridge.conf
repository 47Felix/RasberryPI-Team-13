# Challenge III: Mosquitto-Bridge Pi -> Cloud-Broker (TLS)
# Installation auf dem Pi: nach /etc/mosquitto/conf.d/ kopieren, Platzhalter ersetzen,
# Passwort in /etc/mosquitto/bridge.passwd-artiger Datei NICHT im Repo halten.
# Danach: sudo systemctl restart mosquitto ; Logs: journalctl -u mosquitto -f
#
# Store-and-forward: bei Funkloch puffert der lokale Broker (cleansession false + QoS 1)
# und liefert nach -> lueckenlose Kuehlketten-Nachweise auch bei Tunnel/Funkloch.

connection icetruck-cloud
address CLOUD_HOSTNAME:8883
remote_username pi-bridge
remote_password CHANGE_ME
bridge_cafile /etc/ssl/certs/ca-certificates.crt
bridge_tls_version tlsv1.2
bridge_protocol_version mqttv311
try_private false
cleansession false
start_type automatic
restart_timeout 5 60
keepalive_interval 30
notifications true
notification_topic team13-1/icetruck/bridge/state

# nur Truck-Daten Richtung Cloud (out). Fernsteuerung bewusst NICHT aus der Cloud (Sicherheit).
topic team13-1/icetruck/status out 1
topic team13-1/icetruck/sensors/# out 1
topic team13-1/icetruck/actuators/# out 1
