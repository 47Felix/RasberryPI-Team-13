{% extends "base.html" %}
{% block title %}Admin-Login{% endblock %}
{% block content %}
<div class="card">
  <h1>Admin-Login</h1>
  <p class="muted">Dashboard-Admin-Passwort (nicht der Tresor-Code!)</p>
  {% if error %}<p class="msg-error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="password" name="admin_password" placeholder="Admin-Passwort" required autofocus>
    <button type="submit">Einloggen</button>
  </form>
</div>
{% endblock %}
