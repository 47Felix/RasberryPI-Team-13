<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tresor-Dashboard{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
      --green: #22c55e; --yellow: #eab308; --red: #ef4444; --blue: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
    }
    .card {
      background: var(--card); border-radius: 12px; padding: 24px; width: 100%;
      max-width: 640px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    nav { width: 100%; max-width: 640px; display: flex; justify-content: space-between; margin-bottom: 12px; }
    nav a { color: var(--blue); text-decoration: none; font-size: .9rem; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #334155; }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); font-size: .85rem; }
    input[type=password], input[type=text] {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155;
      background: #0f172a; color: var(--text); font-size: 1rem; margin: 8px 0;
    }
    button {
      background: var(--blue); color: white; border: none; padding: 10px 18px;
      border-radius: 8px; font-size: 1rem; cursor: pointer;
    }
    .msg-success { color: var(--green); }
    .msg-error { color: var(--red); }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; }
    .badge-connected { background: rgba(34,197,94,.2); color: var(--green); }
    .badge-disconnected { background: rgba(239,68,68,.2); color: var(--red); }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('dashboard') }}">🏠 Dashboard</a>
    <a href="{{ url_for('admin') }}">⚙️ Code aendern</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
