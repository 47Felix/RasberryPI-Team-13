<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tresor-Dashboard{% endblock %}</title>
  <style>
    :root {
      --bg: #0e1116; --sidebar: #0a0c10; --panel: #161b22; --panel-2: #1c222b; --border: #262d38;
      --text: #e6e9ef; --muted: #8b95a5;
      --green: #3fd68a; --green2: #22b8a3; --yellow: #f2c14e; --red: #ff5566; --blue: #4fa8ff; --purple: #a78bfa;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 56px; background: var(--sidebar); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px;
      position: sticky; top: 0; height: 100vh;
    }
    .sidebar .logo {
      font-size: 1.3rem; margin-bottom: 14px; width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--green2), var(--blue));
      display: flex; align-items: center; justify-content: center;
    }
    .side-link {
      width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
      color: var(--muted); text-decoration: none; font-size: 1.05rem;
    }
    .side-link:hover, .side-link.active { background: var(--panel-2); color: var(--text); }
    .sidebar .spacer { flex: 1; }
    .live-dot {
      width: 9px; height: 9px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 10px var(--green); margin-bottom: 10px;
      animation: pulseDot 1.6s ease-in-out infinite;
    }
    @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:.35;} }

    .main-col { flex: 1; min-width: 0; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 22px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: rgba(14,17,22,.9); backdrop-filter: blur(6px); z-index: 5;
    }
    .breadcrumb { font-weight: 700; font-size: 1rem; letter-spacing: .01em; }
    .breadcrumb .sep { color: var(--muted); margin: 0 6px; font-weight: 400; }
    .breadcrumb .crumb { color: var(--muted); font-weight: 500; }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 999px;
      background: var(--panel-2); border: 1px solid var(--border); font-size: .72rem; letter-spacing: .04em;
      color: var(--muted); text-transform: uppercase; font-weight: 600;
    }
    .pill-live { color: var(--green); border-color: rgba(63,214,138,.35); background: rgba(63,214,138,.08); }

    main { max-width: 900px; margin: 0 auto; padding: 22px 20px 48px; display: flex; flex-direction: column; gap: 18px; }

    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      overflow: hidden;
    }
    .card > .panel-head {
      padding: 12px 18px; border-bottom: 1px solid var(--border);
      font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 700;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card > .panel-body { padding: 20px 18px; }
    h1 { margin: 0 0 12px; font-size: 1rem; letter-spacing: .02em; color: var(--text); font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 700; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; }
    tr:hover td { background: rgba(255,255,255,.02); }
    .muted { color: var(--muted); font-size: .85rem; }
    input[type=password], input[type=text] {
      width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: .95rem; margin: 8px 0; font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--blue); }
    button {
      background: linear-gradient(135deg, var(--blue), var(--purple)); color: #fff; border: none;
      padding: 11px 20px; border-radius: 9px; font-size: .88rem; cursor: pointer; font-weight: 700; font-family: inherit;
    }
    button:hover { filter: brightness(1.08); }
    .msg-success { color: var(--green); }
    .msg-error { color: var(--red); }
    .badge {
      display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: .72rem;
      text-transform: uppercase; letter-spacing: .04em; font-weight: 700; border: 1px solid transparent;
    }
    .badge-connected { background: rgba(63,214,138,.12); color: var(--green); border-color: rgba(63,214,138,.35); }
    .badge-disconnected { background: rgba(255,85,102,.12); color: var(--red); border-color: rgba(255,85,102,.35); }

    /* ---- Alarm-Effekte ---- */
    #alarm-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 999; display: none;
      background: radial-gradient(circle at 50% 40%, rgba(255,0,30,.0) 0%, rgba(255,0,30,.35) 100%);
    }
    body.alarm-active #alarm-overlay { display: block; animation: strobe .35s steps(1) infinite; }
    @keyframes strobe {
      0%, 49% { background-color: rgba(255,0,30,.0); }
      50%, 100% { background-color: rgba(255,0,30,.28); }
    }
    body.alarm-active .shell { animation: shake .35s infinite; }
    @keyframes shake {
      0%, 100% { transform: translate(0,0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, -2px); }
    }
    .alarm-stripes {
      position: fixed; left: 0; right: 0; height: 14px; z-index: 1000; display: none;
      background: repeating-linear-gradient(45deg, #1a1a1a, #1a1a1a 14px, #ffce00 14px, #ffce00 28px);
    }
    body.alarm-active .alarm-stripes { display: block; }
    #alarm-stripes-top { top: 0; }
    #alarm-stripes-bottom { bottom: 0; }
  </style>
</head>
<body>
  <div id="alarm-overlay"></div>
  <div id="alarm-stripes-top" class="alarm-stripes"></div>
  <div id="alarm-stripes-bottom" class="alarm-stripes"></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="logo">🔐</div>
      <a class="side-link" href="{{ url_for('dashboard') }}" title="Dashboard">🏠</a>
      <a class="side-link" href="{{ url_for('admin') }}" title="Code aendern">⚙️</a>
      <div class="spacer"></div>
      <div class="live-dot" title="Live"></div>
    </aside>
    <div class="main-col">
      <div class="topbar">
        <div class="breadcrumb">TRESOR <span class="sep">/</span> <span class="crumb">{% block crumb %}Live Monitoring{% endblock %}</span></div>
        <div class="pills">
          <span class="pill">SOURCE: ARDUINO</span>
          <span class="pill pill-live">● LIVE · 2S</span>
        </div>
      </div>
      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
