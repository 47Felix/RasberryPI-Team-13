<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Login – Perspektiv</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">Perspektiv</span>
      <span class="brand-tag">Login</span>
    </div>
  </header>

  <main class="app">
    <div class="disclosure settings" open>
      <p class="tab-caption" style="border:none;padding:0.75rem 0 0;">Mit bestehendem Account einloggen.</p>

      {% if not auth_configured %}
        <p class="tab-caption">Supabase-Auth ist nicht konfiguriert – Login ist aktuell nicht möglich.</p>
      {% endif %}
      {% if error %}
        <p class="tab-caption" style="color:var(--contra);">{{ error }}</p>
      {% endif %}

      <form class="settings-row" method="post">
        <label for="email">E-Mail</label>
        <input type="email" name="email" id="email" required>

        <label for="password">Passwort</label>
        <input type="password" name="password" id="password" required>

        <button type="submit" {{ 'disabled' if not auth_configured }}>Einloggen</button>
      </form>

      <p class="tab-caption">Noch keinen Account? <a href="{{ url_for('register') }}">Registrieren</a></p>
    </div>
  </main>
</body>
</html>
